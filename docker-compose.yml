version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb-mcp-test
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: testdb
      MARIADB_USER: mcpuser
      MARIADB_PASSWORD: mcppass
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MCP Server service (optional - for testing SSE/HTTP transport)
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-mariadb-server
    restart: unless-stopped
    environment:
      MCP_MARIADB_HOST: mariadb
      MCP_MARIADB_PORT: 3306
      MCP_MARIADB_USER: mcpuser
      MCP_MARIADB_PASSWORD: mcppass
      MCP_MARIADB_DATABASE: testdb
      MCP_MARIADB_READ_ONLY: "true"
      MCP_MARIADB_MAX_POOL_SIZE: 10
    ports:
      - "9001:9001"
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "9001"]
    profiles:
      - server

volumes:
  mariadb-data:
